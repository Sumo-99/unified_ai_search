[project]
name = "unified-ai-search"
version = "0.1.0"
description = "A synchronous search and extraction interface across AI search providers."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["httpx", "pydantic>=2"]

[dependency-groups]
dev = ["pytest", "respx", "ruff", "mypy"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/unified_ai_search"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "-m", "not live"]
markers = ["live: opt-in tests that call real provider APIs (run with -m live)"]
